<!DOCTYPE html>
<html lang="fr" class="curseur-masque">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affiche_Meteo</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="affichage-complet">

    <!-- Colonne de gauche : capteurs de la maison -->
    <aside class="colonne-capteurs">
        <div id="liste-capteurs">
            Chargement des capteurs...
        </div>
    </aside>

    <!-- Les 6 cases météo -->
    <main class="grille" id="grille">
        <div class="case">Chargement...</div>
    </main>

</div>

<!-- Vue agrandie d'une case de prévision ; un toucher la referme -->
<div id="detail-prevision" class="vue-agrandie" hidden></div>

<!-- Graphiques d'un capteur (24 h et 30 jours) ; un toucher les referme -->
<div id="detail-capteur" class="vue-agrandie" hidden></div>

<!-- Mode nuit : voile sombre sur tout l'écran ; un clic le retire -->
<div id="voile-nuit" hidden title="Toucher pour revenir au mode jour"></div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
